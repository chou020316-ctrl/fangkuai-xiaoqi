button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #9e6588;outline-offset:3px}button:disabled{cursor:default}
.theatre{width:min(100%,460px);margin:0 auto;padding:max(15px,env(safe-area-inset-top)) 22px max(17px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;min-height:85px;margin-bottom:13px}.heading{flex:1;min-width:0}.eyebrow{font-size:12px;letter-spacing:2px;color:#8b7a7e;margin:0 0 6px}h1{font-size:29px;letter-spacing:3px;line-height:1.3;margin:0;color:#685b66;font-weight:800}h1 span{font-size:16px;margin-left:9px;color:#c792a8;vertical-align:middle}.mascot{width:72px;height:72px;object-fit:contain;image-rendering:pixelated;mix-blend-mode:multiply;flex:none}.icon-button{width:34px;height:34px;border:1.5px solid #c9beae;background:#fffaf2df;box-shadow:0 3px 0 #d4c9ba70;border-radius:10px;font-size:24px;flex:none}
.scoreboard{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center}.round{align-self:stretch;display:grid;place-items:center;padding:10px 6px;background:#f7f5deeb;border:2px solid #d4d3b7;border-radius:14px;box-shadow:0 3px 0 #d3d2b14d;white-space:nowrap}.round span{font-size:13px;color:#77775c}.round b{font-family:ui-monospace,monospace;display:block;text-align:center;font-size:28px;line-height:1.15;color:#6d765e;margin-bottom:3px;font-weight:700}.score{position:relative;display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;background:#fffaf2f2;border:2px solid #d3c2bb;border-radius:14px;padding:11px 16px;box-shadow:0 3px 0 #d9c7bd5c;min-width:0}.score>span{font-size:12px;letter-spacing:1px}.score strong{grid-row:1/3;grid-column:2;font-family:ui-monospace,"Courier New",monospace;font-weight:700;font-size:clamp(25px,7vw,33px);letter-spacing:-1px;font-variant-numeric:tabular-nums;color:#986579}.score small{font-size:12px;color:#8b7a7e;white-space:nowrap}.score small b{font-weight:500}
.inventory{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}.tool{padding:7px 4px;min-height:54px;border:1.5px solid #c4c8b4;border-radius:11px;background:#f0f5e7;box-shadow:0 3px 0 #c2cbb76b;position:relative;transition:background .15s,box-shadow .15s}.tool:nth-child(2){background:#fce9ec;border-color:#dbc0c6;box-shadow:0 3px 0 #dbc0c65c}.tool:nth-child(3){background:#e9f0f9;border-color:#bdcbdb;box-shadow:0 3px 0 #bdcbdb69}.tool:nth-child(4){background:#f2eaf7;border-color:#cfc2dc;box-shadow:0 3px 0 #cfc2dc69}.tool-inner{display:grid;grid-template-columns:28px auto;grid-template-rows:18px 16px;justify-content:center;align-items:center;gap:0 5px}.tool svg{grid-row:1/3;width:27px;height:27px;fill:none;stroke:#668169;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tool:nth-child(2) svg{stroke:#ae788c}.tool:nth-child(3) svg{stroke:#6a8da9}.tool:nth-child(4) svg{stroke:#9b7da9}.tool-name{font-size:12px;font-weight:600;white-space:nowrap}.tool small{font-size:12px;color:#8b7980;line-height:1}.tool.empty svg{opacity:.45}.tool.empty .tool-name{color:#91878d}.tool.selected{outline:2px solid #bd7898;outline-offset:2px;box-shadow:0 3px 0 #a96b8a77;background:#ffeff5}.tool:disabled{opacity:.7}
.stage-note{display:flex;align-items:center;justify-content:center;gap:9px;height:35px;margin:8px 0 6px}.stage-note>span{width:15px;height:1px;background:#bdb6aa;flex:none}.stage-note p{font-size:12px;line-height:16px;margin:0;text-align:center;max-height:32px;overflow:hidden;color:#81777c}#tool-prompt{display:none!important}
.board-frame{position:relative;padding:7px 7px 5px;border:2px solid #aaaeb0;border-radius:15px;background:#fffbf5e8;box-shadow:0 5px 0 #bbb7a958,0 11px 30px #937d8621,inset 0 0 0 2px #fff}.board{aspect-ratio:1/1.05;position:relative;width:100%;border:1px solid #c8c8bf;border-radius:7px;overflow:hidden;isolation:isolate;background-color:#e7e9e2;background-image:linear-gradient(to right,#b4bcb52e 1px,transparent 1px),linear-gradient(to bottom,#b4bcb52e 1px,transparent 1px);background-size:10% 10%;touch-action:none}.danger-line{position:absolute;top:10%;left:0;right:0;border-top:1px dashed #ae82925c;pointer-events:none}.board.danger{box-shadow:inset 0 25px 24px -20px #da829ca6}.block{position:absolute;padding:0;border:0;background:transparent;touch-action:none;user-select:none;z-index:2;transition:left .16s ease-out,top .21s cubic-bezier(.4,0,.7,1),opacity .2s}.block::before{content:"";position:absolute;inset:2px;border:1.5px solid #81758388;border-radius:5px;background:linear-gradient(135deg,#ffffff66,transparent 48%),var(--ice);box-shadow:inset 2px 2px 0 #ffffff80,inset -2px -3px 0 #796f7825,0 1px 1px #5f566225}.block::after{content:"";position:absolute;inset:6px;border-top:2px solid #fff9;border-left:2px solid #fff5;border-radius:2px;pointer-events:none;opacity:.6}.block.dragging{transition:none;z-index:5;filter:brightness(1.08) drop-shadow(0 3px 2px #79617955);cursor:grabbing}.block.clearing{animation:shatter .3s both;pointer-events:none}.block:focus-visible{outline-offset:-2px;border-radius:5px}.block.armored::before{border:3px solid #8cbed1;box-shadow:inset 0 0 0 2px #effcff,inset 0 0 11px 4px #ddf5ff,0 0 2px #7b9da4}.ice-shell{position:absolute;inset:4px;border:2px dashed #b1d2de;border-radius:3px;pointer-events:none;z-index:1;background:linear-gradient(125deg,#f1fdffb0,transparent 37%,#d6f1ff9c)}.armored{cursor:not-allowed}.ribboned{cursor:grab}.armored.ribboned{cursor:not-allowed}.bead-ribbon{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);z-index:2;pointer-events:none;filter:drop-shadow(0 1px 1px #67523755)}.gift{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:25px;height:25px;border-radius:7px;background:#fff8ecef;border:1.5px solid #ac8099;display:grid;place-items:center;pointer-events:none;box-shadow:0 2px 0 #8f6d8840}.gift svg{width:21px;height:21px;fill:none;stroke:#99738e;stroke-width:2}.targeting .block{cursor:crosshair}.cracking{animation:crack .32s}.destination{position:absolute;width:10%;height:10%;background:#fffef64d;border:1px dashed #7d9f83;border-radius:4px;z-index:4;padding:0;min-width:0;cursor:crosshair}.destination:after{content:'+';color:#5f836a;font-size:19px}.destination:hover{background:#fffef6bc}
.next-row{height:20px;padding:8px 1px 5px;display:flex}#preview{height:6px;position:relative;flex:1}.preview-piece{position:absolute;top:0;height:6px;border-radius:3px;background:var(--ice);box-shadow:inset 0 0 0 1px #796d7a33}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:17px}.controls button{min-height:43px;border:1.5px solid #c6bcaa;background:#fffaf1e8;border-radius:10px;font-size:14px;box-shadow:0 3px 0 #d1c6b34d;white-space:nowrap;padding:5px}.controls button span{font-size:18px;margin-right:5px;color:#8e7a83}.controls .save{background:#edf4e3;border-color:#bcc8a9}.save-note{font-size:12px;text-align:center;color:#8a8083;margin:15px 0 0;line-height:1.5}footer{font-size:12px;color:#9a828c;text-align:center;margin-top:12px;letter-spacing:.5px}footer span{color:#c988a0;margin-right:5px}
#combo{position:absolute;top:28%;left:0;right:0;pointer-events:none;z-index:6;text-align:center;font-size:25px;font-weight:800;color:#a06083;text-shadow:2px 2px #fff8f0,-1px -1px #fff8f0;opacity:0}#combo small{display:block;font-family:ui-monospace,monospace;font-size:18px;color:#896a89;margin-top:6px}#combo.show{animation:combo 1.4s both}.particle{position:absolute;width:5px;height:5px;border:1px solid #fff9;background:#dfacca;pointer-events:none;z-index:4;animation:spark .65s ease-out forwards}#reward{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:20;background:#fff9eff5;color:#8c6880;border:2px solid #c7a6b6;border-radius:12px;padding:10px 15px;box-shadow:0 4px 0 #b196ab44;font-size:14px;max-width:90vw;width:max-content;transition:.2s}#reward.visible{opacity:1;transform:translate(-50%,0)}
dialog{color:var(--ink);background:#fffaf2;border:2px solid #bba3b3;border-radius:18px;width:min(90vw,410px);padding:28px 23px;max-height:85svh;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 8px 0 #927a922b,0 25px 80px #5b50634d}dialog::backdrop{background:#776d7c66;backdrop-filter:blur(5px)}dialog h2{font-size:24px;letter-spacing:1px;margin:4px 0 20px;color:#8d6c83}dialog h3{font-size:17px;margin:25px 0 18px}dialog p{font-size:15px;line-height:1.8;color:#81717c}.close{position:absolute;right:9px;top:7px;background:transparent;border:0;font-size:26px;color:#9d8296}dialog .primary,dialog .secondary{width:100%;padding:12px;border:1.5px solid #b8c3a8;border-radius:9px;margin-top:14px;font-size:15px}dialog .primary{background:#e5efda;color:#627752;box-shadow:0 3px 0 #b7c8a75c}dialog .secondary{background:#fff7ec;border-color:#d1b9c7;color:#977c8f}.final-score{font:700 42px ui-monospace,monospace!important;color:#a16f8a!important;margin:10px 0!important}.rules{padding:0;list-style:none;counter-reset:steps}.rules li{position:relative;font-size:14px;color:#7a6d76;line-height:1.75;margin:15px 0;padding-left:26px}.rules li:before{counter-increment:steps;content:counter(steps);position:absolute;left:0;color:#af8299;font-weight:700}.rules strong{color:#956a83}.tool-guide{display:grid;gap:16px}.guide-item{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}.guide-icon{width:42px;height:42px;display:grid;place-items:center;background:#f3e5ee;border:1.5px solid #c8b3c1;border-radius:10px}.guide-icon svg{width:30px;height:30px;fill:none;stroke:#9d7b96;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide-item strong{font-size:15px;color:#8a6c81}.guide-item p{font-size:14px;line-height:1.6;margin:4px 0 0}
@keyframes shatter{40%{filter:brightness(1.2);transform:scale(.98)}100%{opacity:0;transform:scale(.78)}}@keyframes crack{50%{filter:brightness(1.4);transform:translateX(2px)}100%{transform:translateX(0)}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}@keyframes combo{0%{opacity:0;transform:translateY(10px) scale(.9)}18%,70%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-15px)}}
@media(min-width:700px){.theatre{margin:26px auto;padding:22px 25px 24px;background:#fffaf280;border:1.5px solid #ffffffd9;border-radius:25px;box-shadow:0 14px 50px #a1889d26;backdrop-filter:blur(4px)}.board{aspect-ratio:1/1}}
@media(max-width:360px){.theatre{padding-left:15px;padding-right:15px}h1{font-size:25px;letter-spacing:2px}.mascot{width:60px;height:60px}header{gap:6px;min-height:73px}.scoreboard{grid-template-columns:64px 1fr;gap:10px}.score{padding:10px}.score strong{font-size:25px}.inventory{gap:7px}.tool-inner{grid-template-columns:23px auto;gap:0 3px}.tool svg{width:23px;height:23px}.controls{gap:8px}}

/* Crisp pixel-candy surfaces with stepped corners and discrete bevels. */
.mascot{mix-blend-mode:normal;background:transparent;border:0;box-shadow:none}
.block::before{inset:2px;border:2px solid #76677b9c;border-radius:0;background:var(--ice);clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,100% 2px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) 100%,4px 100%,4px calc(100% - 2px),0 calc(100% - 2px),0 4px,4px 4px);box-shadow:inset 3px 3px 0 #ffffff78,inset -3px -4px 0 #6d617b35,inset 0 -7px 0 #87738b18}
.block::after{inset:4px;border:0;border-radius:0;opacity:1;background:linear-gradient(#fff9,#fff9) 5px 3px/calc(100% - 17px) 3px no-repeat,linear-gradient(#fffc,#fffc) 3px 6px/3px 5px no-repeat,linear-gradient(#fff5,#fff5) calc(100% - 7px) calc(100% - 9px)/3px 3px no-repeat,repeating-linear-gradient(90deg,#71607820 0 2px,transparent 2px 7px) 6px calc(100% - 4px)/calc(100% - 15px) 2px no-repeat;pointer-events:none}
.block.armored::before{border:2px solid #709eb4;background:var(--ice);box-shadow:inset 3px 3px 0 #e9faff,inset -3px -4px 0 #76a7be88,inset 0 0 0 5px #c4e8f0b8}
.ice-shell{inset:5px;border:2px dashed #f4fdff;border-radius:0;background:linear-gradient(90deg,transparent 45%,#e9faffae 45% 55%,transparent 55%) 65% 30%/10px 10px no-repeat,linear-gradient(transparent 45%,#e9faffae 45% 55%,transparent 55%) 65% 30%/10px 10px no-repeat,linear-gradient(135deg,#effaff77 0 25%,transparent 25% 60%,#def4ff66 60% 75%,transparent 75%);box-shadow:inset 2px 2px 0 #e8fcff88,inset -2px -2px 0 #8ab7c755}
.block.dragging{filter:brightness(1.07) drop-shadow(0 3px 0 #79617940)}
/* A brighter, layered pixel ice shell keeps the candy color visible underneath. */
.block.armored{filter:drop-shadow(0 0 2px #8bc9dc)}
.block.armored::before{inset:1px;border:3px solid #78b5ca;background:linear-gradient(135deg,#effcffbf 0 18%,transparent 18% 55%,#d8f3fb8f 55% 72%,transparent 72%),linear-gradient(#dff6fc5e,#dff6fc5e),var(--ice);box-shadow:inset 3px 3px 0 #f7feff,inset -3px -4px 0 #73aabf,inset 0 0 0 6px #ccecf4b8,0 0 0 1px #effcff}
.ice-shell{inset:3px;border:2px solid #f4fdff;border-radius:0;background:linear-gradient(135deg,transparent 46%,#7fb7ca 47% 50%,transparent 51%) 7px 5px/17px 14px no-repeat,linear-gradient(45deg,transparent 46%,#a1cfdd 47% 50%,transparent 51%) calc(100% - 8px) calc(100% - 6px)/19px 16px no-repeat,linear-gradient(90deg,transparent 43%,#f8ffff 44% 56%,transparent 57%) 78% 22%/11px 11px no-repeat,linear-gradient(transparent 43%,#f8ffff 44% 56%,transparent 57%) 78% 22%/11px 11px no-repeat,linear-gradient(120deg,#ffffff8f 0 18%,transparent 19% 63%,#d6f2fa78 64% 78%,transparent 79%);box-shadow:inset 2px 2px 0 #ffffff,inset -2px -2px 0 #9acbd9}
.ice-shell::before,.ice-shell::after{content:"";position:absolute;width:5px;height:5px;background:#f8ffff;box-shadow:5px 0 #a9d9e5,0 5px #a9d9e5;image-rendering:pixelated}
.ice-shell::before{left:1px;top:1px}.ice-shell::after{right:3px;bottom:3px;transform:rotate(180deg)}

</main><dialog id="dialog"><button class="close" id="close" aria-label="关闭">×</button><div id="dialog-content"></div></dialog><script type="module">const COLS=10, ROWS=10;
function occupied(blocks,except=null){const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));for(const b of blocks){if(b.id===except)continue;for(let x=b.x;x<b.x+b.w;x++)if(g[b.y])g[b.y][x]=b.id;}return g;}
function bounds(blocks,b){let left=0,right=COLS-b.w;for(const o of blocks){if(o.id===b.id||o.y!==b.y)continue;if(o.x+o.w<=b.x)left=Math.max(left,o.x+o.w);if(o.x>=b.x+b.w)right=Math.min(right,o.x-b.w);}return {left,right};}
function fall(blocks){let moved=false;for(const b of [...blocks].sort((a,b)=>b.y-a.y)){const g=occupied(blocks,b.id);let y=b.y;while(y+1<ROWS&&Array.from({length:b.w},(_,i)=>g[y+1][b.x+i]).every(v=>v===null))y++;if(y!==b.y){b.y=y;moved=true;}}return moved;}
function fullRows(blocks){return occupied(blocks).flatMap((row,y)=>row.every(v=>v!==null)?[y]:[]);}
function makeRow(makeBlock,random=Math.random,round=1){const gapStart=Math.floor(random()*8),gapSize=1+Math.floor(random()*2);const blocks=[];let x=0;while(x<COLS){if(x>=gapStart&&x<gapStart+gapSize){x++;continue;}const limit=x<gapStart?gapStart:COLS;const roll=random(),p=difficulty(round).long;const length=roll<p?3:roll<p+(1-p)/2?2:1;const w=Math.min(limit-x,length);blocks.push(makeBlock(x,ROWS-1,w));x+=w;}return blocks;}
const TOOL_TYPES=['row','single','move','color'];
function difficulty(round){const ramp=Math.max(0,round-39);return {long:round<30?1/3:Math.min(.50,1/3+(round-29)*.004),ice:round<15?0:Math.min(.22,.18+ramp*.001),ribbon:round<25?0:Math.min(.20,.15+ramp*.00125),gift:.06};}
function decorateRow(blocks,round,random=Math.random){const d=difficulty(round);return blocks.map(b=>({...b,hp:random()<d.ribbon?2:1,locked:random()<d.ice,gift:random()<d.gift?TOOL_TYPES[Math.floor(random()*4)]:null}));}
function guaranteeGift(row,round,lastGiftRound,random=Math.random){if(row.some(b=>b.gift))return round;if(round-lastGiftRound>=16&&row.length){row[Math.floor(random()*row.length)].gift=TOOL_TYPES[Math.floor(random()*TOOL_TYPES.length)];return round;}return lastGiftRound;}
function grant(inventory,type){if(!TOOL_TYPES.includes(type)||inventory[type]>=2)return false;inventory[type]++;return true;}
function rowSignature(blocks,y){return blocks.filter(b=>b.y===y).map(b=>b.id).sort((a,b)=>a-b).join(',');}
function hitTargets(blocks,targets,protectedIds=new Set()){const selected=new Set(targets.map(b=>b.id)),removed=[],cracked=[];for(const b of blocks){if(!selected.has(b.id)||protectedIds.has(b.id))continue;if(b.hp===2){b.hp=1;cracked.push(b);}else removed.push(b);}const ids=new Set(removed.map(b=>b.id));return {blocks:blocks.filter(b=>!ids.has(b.id)),removed,cracked};}
function hitRows(blocks,rows,protectedIds=new Set()){return hitTargets(blocks,blocks.filter(b=>rows.includes(b.y)),protectedIds);}
function canPlace(blocks,b,x,y){if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||x+b.w>COLS||y<0||y>=ROWS)return false;return !blocks.some(o=>o.id!==b.id&&o.y===y&&o.x<x+b.w&&o.x+o.w>x);}
function toolTargets(blocks,type,target){return blocks.filter(b=>type==='row'?b.y===target.y:type==='color'?b.c===target.c:b.id===target.id);}
function migrate(s){if(!s||![1,2,3,4].includes(s.version))return null;const oldVersion=s.version;const blocks=[...(s.blocks||[]),...(s.next||[])];if(!Array.isArray(s.blocks)||!Array.isArray(s.next)||s.blocks.length>100||s.next.length>10||!Number.isInteger(s.round)||s.round<1||!Number.isFinite(s.score)||!Number.isFinite(s.best))return null;const ids=new Set();for(const b of blocks){if(!Number.isInteger(b.id)||ids.has(b.id)||!Number.isInteger(b.x)||!Number.isInteger(b.y)||!Number.isInteger(b.w)||b.w<1||b.w>4||b.x<0||b.x+b.w>COLS||b.y<0||b.y>=ROWS||!Number.isInteger(b.c)||b.c<0||b.c>5)return null;ids.add(b.id);const oldHp=b.hp,oldLocked=b.locked;b.hp=oldVersion===2?(oldLocked?2:1):(b.hp===2?2:1);b.locked=oldVersion===2?oldHp===2:!!b.locked;b.gift=TOOL_TYPES.includes(b.gift)?b.gift:null;}for(const list of [s.blocks,s.next])for(const b of list)if(!canPlace(list,b,b.x,b.y))return null;s.inventory=Object.fromEntries(TOOL_TYPES.map(t=>[t,Math.min(2,Math.max(0,Math.floor(s.inventory?.[t]||0)))]));s.lastRewardRound=oldVersion<3?Math.floor(s.round/8)*8:Math.max(0,Math.floor(s.lastRewardRound||0));s.lastBlockGiftRound=oldVersion<4?s.round:Math.max(0,Math.floor(s.lastBlockGiftRound||0));s.version=4;return s;}

function clearScore(rowCount,chain){return rowCount*1000*(chain>=2?2:1);}

const $=id=>document.getElementById(id),board=$('board'),layer=$('blocks'),palette=['#a4cdb7','#e9afbf','#c2b7df','#ecd38d','#e8b89c','#a8cedc'];
const KEY='ice-theatre-v1';let state,serial=0,busy=false,drag=null,audio=null,sound=false,selectedTool=null,moveSource=null;const elements=new Map();
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const makeBlock=(x,y,w)=>({id:++serial,x,y,w,c:Math.floor(Math.random()*palette.length)});
function getStored(){try{return JSON.parse(localStorage.getItem(KEY));}catch{return null;}}
function save(manual=false){if(busy){if(manual)note('这一手结束后会自动保存');return;}try{localStorage.setItem(KEY,JSON.stringify({...state,sound,version:4}));if(manual)note('已保存，下次回来继续这一局');}catch{$('save-note').textContent='当前浏览器无法存档，请保持页面打开';}}
function note(text){$('message').textContent=text;}
function tone(combo=1){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();[0,4,7].forEach((n,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime+i*.065;osc.type='sine';osc.frequency.value=440*Math.pow(2,(n+combo*2)/12);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.055,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+.3);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.32);});}catch{sound=false;updateSound();}}
function updateSound(){$('sound').innerHTML='<span>♪</span> 声音'+(sound?'开':'关');$('sound').setAttribute('aria-pressed',String(sound));}
function render(){renderInventory();renderAdvanceRow();const ids=new Set(state.blocks.map(b=>b.id));for(const [id,el]of elements){if(!ids.has(id)){el.remove();elements.delete(id);}}
for(const b of state.blocks){let el=elements.get(b.id);if(!el){el=document.createElement('button');el.className='block';el.dataset.id=b.id;el.addEventListener('pointerdown',beginDrag);el.addEventListener('keydown',onKey);layer.append(el);elements.set(b.id,el);}el.classList.toggle('armored',!!b.locked);el.classList.toggle('ribboned',b.hp===2);el.innerHTML=(b.hp===2?ribbonMarkup(b.w):'')+(b.locked?'<i class="ice-shell"></i>':'')+(b.gift?'<span class="gift">'+ICONS[b.gift]+'</span>':'');el.style.left=b.x*10+'%';el.style.top=b.y*10+'%';el.style.width=b.w*10+'%';el.style.height='10%';el.style.setProperty('--ice',palette[b.c]);el.setAttribute('aria-label',`${b.w}格冰块，第${b.y+1}行第${b.x+1}列。${b.hp===2?"有彩带，需两次消除。":""}${b.locked?"冰封锁定。":"左右方向键移动。"}${b.gift?"携带"+NAMES[b.gift]:""}`);el.setAttribute('aria-disabled',String(busy||state.over));}
$('score').textContent=state.score.toLocaleString();$('best').textContent=state.best.toLocaleString();$('round').textContent=state.round;board.classList.toggle('danger',state.blocks.some(b=>b.y<3));$('preview').replaceChildren(...state.next.map(b=>{const e=document.createElement('i');e.className='preview-piece';e.style.left=b.x*10+'%';e.style.width=`calc(${b.w*10}% - 3px)`;e.style.setProperty('--ice',palette[b.c]);return e;}));}
function fresh(){if(busy)return;cancelTool();const oldBest=state?.best||0;serial=0;state={version:4,inventory:{row:0,single:0,move:0,color:0},lastRewardRound:0,lastBlockGiftRound:0,score:0,best:oldBest,round:1,over:false,blocks:[[0,9,3],[6,9,2],[8,9,2],[0,8,2],[4,8,3],[8,8,2],[1,7,3],[5,7,2],[8,7,1]].map(([x,y,w])=>makeBlock(x,y,w)),next:[]};state.next=newRow(2);fall(state.blocks);render();note('试试把中间的三格冰块，向左滑一格');save();}
function beginDrag(e){if(busy||state.over||e.button!==0)return;const id=Number(e.currentTarget.dataset.id),b=state.blocks.find(b=>b.id===id);if(!b)return;e.preventDefault();unlockAudio();if(selectedTool){if(selectedTool==='move'){beginTeleport(e,b);}else useRemoval(b);return;}if(b.locked){note('冰封方块不能拖动，可以用搬移道具');return;}const limit=bounds(state.blocks,b);drag={id,start:e.clientX,x:b.x,target:b.x,cell:board.getBoundingClientRect().width/COLS,limit,pointer:e.pointerId,el:e.currentTarget};drag.el.classList.add('dragging');drag.el.setPointerCapture(e.pointerId);drag.el.addEventListener('pointermove',moveDrag);drag.el.addEventListener('pointerup',endDrag);drag.el.addEventListener('pointercancel',cancelDrag);}
function moveDrag(e){if(!drag||e.pointerId!==drag.pointer)return;if(drag.teleport){moveTeleport(e);return;}const x=Math.max(drag.limit.left,Math.min(drag.limit.right,drag.x+(e.clientX-drag.start)/drag.cell));drag.target=Math.round(x);drag.el.style.left=x*10+'%';}
function detach(){const d=drag;if(!d)return null;d.el.classList.remove('dragging');d.el.removeEventListener('pointermove',moveDrag);d.el.removeEventListener('pointerup',endDrag);d.el.removeEventListener('pointercancel',cancelDrag);if(d.el.hasPointerCapture(d.pointer))d.el.releasePointerCapture(d.pointer);drag=null;return d;}
function endDrag(e){if(!drag||e.pointerId!==drag.pointer)return;moveDrag(e);const d=detach();if(d.teleport){if(Math.hypot(e.clientX-d.start,e.clientY-d.startY)>8)teleportTo(d.id,d.target,d.targetY);else {render();showDestinations();}return;}commit(d.id,d.target);}
function cancelDrag(){detach();render();if(selectedTool==='move'&&moveSource)showDestinations();}
function onKey(e){if(selectedTool&&['Enter',' '].includes(e.key)){e.preventDefault();const b=state.blocks.find(b=>b.id===Number(e.currentTarget.dataset.id));if(b&&!busy&&!state.over){if(selectedTool==='move'){moveSource=b.id;showDestinations();}else useRemoval(b);}return;}if(selectedTool||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if(busy||state.over)return;const b=state.blocks.find(b=>b.id===Number(e.currentTarget.dataset.id));if(b&&!b.locked)commit(b.id,b.x+(e.key==='ArrowLeft'?-1:1));}
function burst(rows){const rect=board.getBoundingClientRect();for(const y of rows)for(let i=0;i<24;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.top=(y+.5)*10+'%';p.style.setProperty('--dx',(Math.random()-.5)*100+'px');p.style.setProperty('--dy',(-20+Math.random()*rect.height*.22)+'px');$('effects').append(p);setTimeout(()=>p.remove(),700);}}
async function settle(chain,protectedIds=new Set()){const seen=new Set();while(true){if(fall(state.blocks)){render();await delay(230);}const rows=fullRows(state.blocks).filter(y=>!seen.has(rowSignature(state.blocks,y))&&state.blocks.some(b=>b.y===y&&!protectedIds.has(b.id)));if(!rows.length)break;rows.forEach(y=>seen.add(rowSignature(state.blocks,y)));chain.value++;const result=hitRows(state.blocks,rows,protectedIds),earned=clearScore(rows.length,chain.value);state.score+=earned;state.best=Math.max(state.best,state.score);for(const b of result.removed)elements.get(b.id)?.classList.add('clearing');for(const b of result.cracked)elements.get(b.id)?.classList.add('cracking');burst(rows);tone(chain.value);const combo=$('combo');combo.classList.remove('show');void combo.offsetWidth;combo.innerHTML=(chain.value>1?'COMBO '+chain.value+' · ×2':'好棒！')+'<small>+'+earned.toLocaleString()+'</small>';combo.classList.add('show');note(result.cracked.length?'彩带解开了，再消一次就能清除':chain.value>1?`${chain.value} 次连消，漂亮！`:'消掉一行，心情也轻一点');await delay(320);collectGifts(result.removed);state.blocks=result.blocks;for(const el of elements.values())el.classList.remove('cracking');render();}return chain;}
async function commit(id,x){if(busy||state.over)return;const b=state.blocks.find(b=>b.id===id);if(!b||b.locked)return;const limit=bounds(state.blocks,b);x=Math.max(limit.left,Math.min(limit.right,x));if(x===b.x){render();return;}busy=true;b.x=x;render();await delay(180);const chain={value:0};await settle(chain);
await advanceRound(chain);
busy=false;render();save();if(state.over)showOver();else if(!chain.value)note(state.blocks.some(b=>b.y<3)?'冰块快到顶了，找找能落下的空隙':'看好下一行，给冰块留一点余地');}

function hasLegalMove(){return state.blocks.some(b=>{if(b.locked)return false;const limit=bounds(state.blocks,b);return limit.left<b.x||limit.right>b.x;});}
function renderAdvanceRow(){const el=$('advance-row');el.hidden=busy||state.over||hasLegalMove();el.disabled=busy||state.over;}
async function advanceRound(chain){if(state.blocks.some(b=>b.y===0)){state.over=true;}else{for(const b of state.blocks)b.y--;state.blocks.push(...state.next.map(b=>({...b,y:ROWS-1})));state.round++;state.next=newRow(state.round+1);if(state.round%8===0&&state.round>state.lastRewardRound){state.lastRewardRound=state.round;receive(TOOL_TYPES[Math.floor(Math.random()*4)],"回合礼物");}render();await delay(240);await settle(chain);if(state.blocks.some(b=>b.y===0))state.over=true;}}
async function manualAdvance(){if(busy||state.over||hasLegalMove())return;cancelTool();unlockAudio();busy=true;render();const chain={value:0};await advanceRound(chain);busy=false;render();save();if(state.over)showOver();else if(!chain.value)note('已升起一行，看看新的空隙吧');}
$('advance-row').onclick=manualAdvance;

function showDialog(html){$('dialog-content').innerHTML=html;if(!$('dialog').open)$('dialog').showModal();}
function showOver(){note('休息一下，再来一局吧');showDialog('<p class="eyebrow">NICE LITTLE BREAK</p><h2>这一局，真精彩</h2><p class="final-score">'+state.score.toLocaleString()+'</p><p>冰块到达顶端。本场走过 '+state.round+' 回合，最高纪录 '+state.best.toLocaleString()+' 分。</p><button class="primary" id="again">再来一局</button>');$('again').onclick=()=>{$('dialog').close();fresh();};}
$('help').onclick=()=>{showDialog('<p class="eyebrow">HOW TO PLAY</p><h2>让冰块，恰好落下</h2><ol class="rules"><li>左右滑动冰块；下方没有支撑时会自动下落，填满一整行即可消除。</li><li>每次有效移动后底部升起一行，底部颜色条是预告。冰块到顶则结束。完全没有方块能左右移动时，棋盘下方会出现“点击升一行”；点击推进一回合，仍可选择先使用道具。</li><li>每行基础 1,000 分。同一次操作中，第二次及之后的连续消除，每行均为 <strong>2,000 分（双倍）</strong>。</li><li><strong>第 15 回合起 · 冰封块</strong>：无法普通拖动，仍会下落，可以消除或用搬移道具移动。</li><li><strong>第 25 回合起 · 彩带块</strong>：可以拖动，第一次消除解开彩带，第二次消除方块。</li><li>第 30 回合起三格长块逐渐增多，第 40 回合起特殊块逐渐增多，并设有上限。新方块携带道具的概率为 6%，连续 16 回合未出现时会保底出现一个。</li></ol><h3>四种小帮手</h3><div class="tool-guide">'+TOOL_TYPES.map(type=>'<div class="guide-item"><span class="guide-icon">'+ICONS[type]+'</span><div><strong>'+NAMES[type]+'</strong><p>'+({row:'点击方块，对所在行全部方块消除一次；彩带块只解开彩带。',single:'点击方块消除一次；彩带块第一次只解开彩带。',move:'选中方块后拖到空位，或再点一个空位。冰封方块也可以搬移。',color:'点击方块，对所有同色方块消除一次；彩带块只解开彩带。'}[type])+'</p></div></div>').join('')+'</div><p>每 <strong>8 回合</strong>随机赠送一个道具；携带道具的方块真正消失时也会掉落。每种上限 2 个，满格不再获取。</p><p>先点道具图标，再选目标；再次点击同一道具即可取消。道具不推进回合，取消或无效操作不扣道具。消除类道具也遵守彩带的两次消除规则；解开彩带不掉落道具，方块真正消失后才会掉落。冰封块可以被消除。</p><button class="primary" id="understood">继续游戏</button>');$('understood').onclick=()=>$('dialog').close();};
$('close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close();}});
$('restart').onclick=()=>{if(busy){note('等这次消除结束，就可以重新开始');return;}showDialog('<h2>再玩一局？</h2><p>当前这一局会结束，最高纪录会保留。</p><button class="primary" id="new-game">重新开始</button><button class="secondary" id="keep-playing">继续这一局</button>');$('new-game').onclick=()=>{$('dialog').close();fresh();};$('keep-playing').onclick=()=>$('dialog').close();};
$('save').onclick=()=>save(true);$('sound').onclick=()=>{sound=!sound;updateSound();if(sound)tone();save();};document.addEventListener('visibilitychange',()=>{if(document.hidden){if(drag)cancelDrag();save();}});window.addEventListener('resize',()=>{if(drag)cancelDrag();});
const NAMES={row:'整行消除',single:'单块消除',move:'自由搬移',color:'同色消除'};
const ICONS={row:'<svg viewBox="0 0 40 40"><path d="M3 12h9M1 20h11M3 28h9"/><circle cx="25" cy="20" r="12"/><circle cx="23" cy="17" r="1"/><circle cx="28" cy="21" r="1"/><circle cx="21" cy="24" r="1"/></svg>',single:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="8"/><path d="M20 2v36M2 20h36M20 20L34 6"/></svg>',move:'<svg viewBox="0 0 40 40"><path d="M20 3L38 35H2Z"/><path d="M20 12v17M12 22h16M17 15l3-3 3 3M17 26l3 3 3-3M15 19l-3 3 3 3M25 19l3 3-3 3"/></svg>',color:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path stroke="#eb9bbe" d="M20 4v32"/><path stroke="#83d3bd" d="M4 20h32"/><path stroke="#ceb6ff" d="M9 9l22 22"/><path stroke="#ffe29e" d="M9 31L31 9"/><circle cx="20" cy="20" r="4"/></svg>'};
function ribbonMarkup(cells){const width=cells*40,colors=['#edc874','#d78bac','#85c8d0','#d2b5e1','#f4db99'];let paths='',beads='';for(let strand=0;strand<2;strand++){const y0=strand?32:8,y1=strand?8:32;paths+='<path d="M4 '+y0+' Q '+width/2+' 20 '+(width-4)+' '+y1+'" fill="none" stroke="#99774d" stroke-width="1.5"/><path d="M4 '+(y0-.5)+' Q '+width/2+' 19.5 '+(width-4)+' '+(y1-.5)+'" fill="none" stroke="#f8de92" stroke-width=".55"/>';const n=Math.max(5,cells*6);for(let i=0;i<=n;i++){const t=i/n,x=4+t*(width-8),y=y0+t*(y1-y0),radius=i%3===0?1.9:1.35;beads+='<circle cx="'+x+'" cy="'+y+'" r="'+radius+'" fill="'+colors[(i+strand*2)%colors.length]+'" stroke="#806745" stroke-width=".55"/><circle cx="'+(x-.4)+'" cy="'+(y-.5)+'" r=".45" fill="#fff7dc"/>';}}return '<svg class="bead-ribbon" viewBox="0 0 '+width+' 40" preserveAspectRatio="none" aria-hidden="true">'+paths+beads+'</svg>';}
function newRow(round){const row=decorateRow(makeRow(makeBlock,Math.random,round),round);state.lastBlockGiftRound=guaranteeGift(row,round,state.lastBlockGiftRound);return row;}
function unlockAudio(){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});}catch{}}
function renderInventory(){for(const type of TOOL_TYPES){let el=$('tool-'+type);if(!el){el=document.createElement('button');el.id='tool-'+type;el.className='tool';el.onclick=()=>selectTool(type);$('inventory').append(el);}el.innerHTML='<span class="tool-inner">'+ICONS[type]+'<b class="tool-name">'+({row:'整行',single:'单块',move:'搬移',color:'同色'}[type])+'</b><small>'+state.inventory[type]+'/2</small></span>';el.classList.toggle('empty',!state.inventory[type]);el.classList.toggle('selected',selectedTool===type);el.setAttribute('aria-label',NAMES[type]+'，'+state.inventory[type]+'个，上限2个');el.setAttribute('aria-pressed',String(selectedTool===type));el.disabled=busy||state.over;el.title=NAMES[type];}}
let rewardTimer;
function receive(type,source){const ok=grant(state.inventory,type);$('reward').textContent=ok?source+' · 获得'+NAMES[type]:NAMES[type]+'已满（2/2），无法获取';$('reward').classList.add('visible');clearTimeout(rewardTimer);rewardTimer=setTimeout(()=>$('reward').classList.remove('visible'),3200);return ok;}
function collectGifts(blocks){for(const b of blocks)if(b.gift)receive(b.gift,'冰块掉落');}
function cancelTool(){selectedTool=null;moveSource=null;$('tool-prompt').hidden=true;$('destinations').replaceChildren();board.classList.remove('targeting');if(state)renderInventory();}
function selectTool(type){if(busy||state.over)return;if(selectedTool===type){cancelTool();return;}if(!state.inventory[type]){note(NAMES[type]+'暂时没有，每8回合或消除携带道具的冰块可获得');return;}cancelTool();selectedTool=type;unlockAudio();board.classList.add('targeting');$('tool-prompt').hidden=true;$('tool-instruction').textContent=type==='move'?'选择冰块，拖到空位；也可以点选空位':type==='row'?'点击冰块，清除它所在的整行':type==='color'?'点击冰块，清除所有同色冰块':'点击要永久清除的冰块';renderInventory();}
function refillEmptyBoard(){if(state.over||state.blocks.length)return false;cancelTool();const incoming=state.next.length?state.next:newRow(state.round+1);state.blocks=incoming.map(b=>({...b,y:ROWS-1}));state.next=newRow(state.round+1);return true;}
async function useRemoval(target){if(busy||!selectedTool||selectedTool==='move'||!state.inventory[selectedTool])return;const type=selectedTool,targets=toolTargets(state.blocks,type,target);if(!targets.length)return;state.inventory[type]--;cancelTool();busy=true;const result=hitTargets(state.blocks,targets);render();for(const b of result.removed)elements.get(b.id)?.classList.add('clearing');for(const b of result.cracked)elements.get(b.id)?.classList.add('cracking');burst([...new Set(targets.map(b=>b.y))]);tone();await delay(320);state.blocks=result.blocks;for(const el of elements.values())el.classList.remove('cracking');collectGifts(result.removed);state.score+=result.removed.reduce((sum,b)=>sum+b.w*100,0);state.best=Math.max(state.best,state.score);render();await settle({value:0},new Set(result.cracked.map(b=>b.id)));refillEmptyBoard();busy=false;render();save();note(result.cracked.length?'彩带已解开，下次消除才能清除方块':NAMES[type]+'已使用，不消耗回合');}
function showDestinations(){const b=state.blocks.find(b=>b.id===moveSource);$('destinations').replaceChildren();if(!b)return;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if((x===b.x&&y===b.y)||!canPlace(state.blocks,b,x,y))continue;const cell=document.createElement('button');cell.className='destination';cell.style.left=x*10+'%';cell.style.top=y*10+'%';cell.setAttribute('aria-label','搬到第'+(y+1)+'行第'+(x+1)+'列');cell.onclick=()=>teleportTo(b.id,x,y);$('destinations').append(cell);}}
function beginTeleport(e,b){moveSource=b.id;$('destinations').replaceChildren();const r=board.getBoundingClientRect();drag={id:b.id,teleport:true,start:e.clientX,startY:e.clientY,x:b.x,y:b.y,target:b.x,targetY:b.y,cell:r.width/COLS,cellY:r.height/ROWS,pointer:e.pointerId,el:e.currentTarget};drag.el.classList.add('dragging');drag.el.setPointerCapture(e.pointerId);drag.el.addEventListener('pointermove',moveDrag);drag.el.addEventListener('pointerup',endDrag);drag.el.addEventListener('pointercancel',cancelDrag);}
function moveTeleport(e){const b=state.blocks.find(b=>b.id===drag.id),x=Math.max(0,Math.min(COLS-b.w,drag.x+(e.clientX-drag.start)/drag.cell)),y=Math.max(0,Math.min(ROWS-1,drag.y+(e.clientY-drag.startY)/drag.cellY));drag.target=Math.round(x);drag.targetY=Math.round(y);drag.el.style.left=x*10+'%';drag.el.style.top=y*10+'%';}
async function teleportTo(id,x,y){if(busy||selectedTool!=='move'||!state.inventory.move)return;const b=state.blocks.find(b=>b.id===id);if(!b||!canPlace(state.blocks,b,x,y)||(b.x===x&&b.y===y)){render();showDestinations();note('这里放不下，换一个空位；道具未消耗');return;}state.inventory.move--;cancelTool();busy=true;b.x=x;b.y=y;render();await delay(230);await settle({value:0});refillEmptyBoard();busy=false;if(state.blocks.some(b=>b.y===0))state.over=true;render();save();if(state.over)showOver();else note('搬移完成，不消耗回合');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selectedTool)cancelTool();});$('cancel-tool').onclick=cancelTool;
const stored=migrate(getStored());if(stored){state=stored;serial=Math.max(0,...state.blocks.map(b=>b.id),...state.next.map(b=>b.id));sound=!!stored.sound;refillEmptyBoard();render();note('欢迎回来，接着这一局');save();if(state.over)showOver();}else fresh();updateSound();
</script></body></html>
